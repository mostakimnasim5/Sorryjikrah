<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jikrah, আমি দুঃখিত 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f4;--card:#ffffff;--ink:#4a1730;--soft:#9b5670;--accent:#e0245e;--line:#f6cad8;--bar:#f9d5e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#21091a;--card:#33112a;--ink:#ffe3ec;--soft:#d79ab3;--accent:#ff5c8a;--line:#5a2145;--bar:#4a1a3a}}
:root[data-theme="dark"]{--bg:#21091a;--card:#33112a;--ink:#ffe3ec;--soft:#d79ab3;--accent:#ff5c8a;--line:#5a2145;--bar:#4a1a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",sans-serif;display:flex;flex-direction:column}
header{padding:20px 20px 12px;text-align:center}
h1{margin:0;font-size:clamp(1.6rem,6vw,2.4rem);font-weight:700;line-height:1.3}
h1 span{color:var(--accent)}
.sub{margin:6px 0 0;color:var(--soft);font-size:1rem}
.count{margin:14px auto 0;max-width:560px}
.num{font-size:1.1rem;font-weight:600}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
#list{flex:1;min-height:0;overflow-y:hidden;margin:8px auto 0;width:100%;max-width:560px;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:baseline;font-size:1.05rem;line-height:1.5}
.row b{color:var(--accent);min-width:3.2ch;font-weight:600}
.done{display:none;text-align:center;padding:18px 16px;border:2px solid var(--accent);border-radius:18px;margin-top:6px;font-size:1.2rem;font-weight:600;line-height:1.6}
.ctl{display:flex;gap:10px;justify-content:center;padding:12px 16px 16px}
button{font:inherit;font-weight:600;padding:10px 20px;border-radius:99px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.p{background:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <h1>Jikrah, আমি <span>সত্যিই দুঃখিত</span> 🥺</h1>
  <p class="sub">আমার কথায় তুমি কষ্ট পেয়েছ। তাই ১০০০ বার মন থেকে সরি।</p>
  <div class="count"><div class="num" id="num">০ / ১০০০</div><div class="bar"><i id="fill"></i></div></div>
</header>
<div id="list" aria-live="off"></div>
<div class="ctl">
  <button id="pause" class="p">থামাও ⏸️</button>
  <button id="restart">আবার শুরু 🔁</button>
</div>
<script>
(function(){
  var TOTAL=1000, DELAY=350;
  var msgs=[
    "সরি Jikrah, আমি ভুল করেছি",
    "আমার কথায় তুমি কষ্ট পেয়েছ, আমি সত্যিই দুঃখিত",
    "তোমাকে অপমান করার ইচ্ছা আমার ছিল না, মাফ করে দাও",
    "আমি আমার ভুলটা বুঝতে পেরেছি",
    "তুমি আমার কাছে অনেক বেশি গুরুত্বপূর্ণ",
    "আর কখনো এমন কথা বলব না, প্রমিস",
    "মন থেকে সরি বলছি, Jikrah",
    "আমাকে একটা সুযোগ দাও, প্লিজ",
    "তোমার মন খারাপ থাকলে আমার একদম ভালো লাগে না",
    "অনেক অনেক অনেক সরি",
    "আমি না ভেবে কথাটা বলে ফেলেছি, ক্ষমা করো",
    "তোমার চোখে জল আমি সহ্য করতে পারি না",
    "তুমি হাসলে আমার পুরো দিনটা সুন্দর হয়ে যায়",
    "আমার বোকামির কারণে তোমাকে কষ্ট দিয়েছি, সরি",
    "তুমি রাগ করে থাকলে আমার কিছুই ভালো লাগে না",
    "এবার থেকে কথা বলার আগে দুইবার ভাবব",
    "তোমার সম্মান আমার কাছে সবার আগে",
    "আমি তোমাকে কষ্ট দিতে চাইনি, বিশ্বাস করো",
    "তুমি আমার জীবনের সবচেয়ে সুন্দর মানুষ",
    "আমার ভুলের জন্য আমি নিজেও কষ্ট পাচ্ছি",
    "প্লিজ Jikrah, আর রাগ করে থেকো না",
    "তোমার একটুখানি হাসি আমার সবচেয়ে বড় শান্তি",
    "আমি নিজের ভুল মেনে নিচ্ছি, কোনো অজুহাত নেই",
    "তুমি যা বলবে আমি তাই শুনব, শুধু মাফ করো",
    "কথাটা আমি ফিরিয়ে নিতে চাই, সরি",
    "তোমাকে ছাড়া সবকিছু ফাঁকা লাগে",
    "আমি আরও ভালো মানুষ হওয়ার চেষ্টা করব",
    "তোমার কষ্টটা আমি বুঝতে পারছি",
    "তুমি আমাকে কত ভালোবাসো, আমি সেটা জানি",
    "একটা ভুলের জন্য আমাকে দূরে ঠেলে দিও না",
    "আমি সত্যিই লজ্জিত, Jikrah",
    "আমার প্রতিটা সরি তোমার জন্য মন থেকে",
    "তুমি আমার সবচেয়ে প্রিয় মানুষ",
    "আমাকে মাফ করে দিলে আমি খুব খুশি হব",
    "তোমার মন ভালো করতে আমি সবকিছু করব",
    "কথাটা বলা আমার মোটেই উচিত হয়নি",
    "তোমার অভিমান আমার হৃদয়ে লাগছে",
    "আমি কথা দিচ্ছি, এমন ভুল আর হবে না",
    "তুমি পাশে থাকলে আমি সবচেয়ে ভালো থাকি",
    "রাগ ভুলে একবার আমার দিকে তাকাও না",
    "আমি দুঃখিত, খুব খুব দুঃখিত",
    "তোমার প্রতি আমার শ্রদ্ধা কখনো কমবে না",
    "আমার বোকামি ক্ষমা করে দাও, লক্ষ্মীটি",
    "তুমি যতক্ষণ না হাসছ, আমি সরি বলেই যাব",
    "আমার ভালোবাসা সত্যি, শুধু কথাটাই ভুল ছিল",
    "আমি তোমার মন ভাঙতে চাইনি",
    "তোমাকে কষ্ট দিয়ে আমার শান্তি নেই",
    "এবারের মতো মাফ করে দাও, আর হবে না",
    "তুমি আমার কাছে পৃথিবীর সবচেয়ে দামি",
    "ভুল হয়ে গেছে, শুধরে নেওয়ার সুযোগ দাও",
    "Jikrah, তুমি আমার সবকিছু",
    "আমার সরি শুধু মুখের কথা নয়, মনের ভেতর থেকে",
    "তোমার মুখে হাসি ফেরাতে আমি সব করতে রাজি",
    "আজ থেকে আরও যত্ন করে কথা বলব",
    "ক্ষমা চাইছি, ভালোবাসি তোমাকে"
  ];
  var queue=[], lastMsg=-1;
  function nextMsg(){
    if(!queue.length){
      queue=msgs.map(function(_,k){return k});
      for(var k=queue.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var x=queue[k];queue[k]=queue[j];queue[j]=x;}
      if(queue[queue.length-1]===lastMsg){var y=queue.pop();queue.unshift(y);}
    }
    lastMsg=queue.pop();
    return msgs[lastMsg];
  }
  var emo=["🥺","💗","🙏","😔","💖","🌸","🫶","😢","❤️","🌹","💕","🤍"];
  var list=document.getElementById("list"), num=document.getElementById("num"),
      fill=document.getElementById("fill"), pauseBtn=document.getElementById("pause"),
      restartBtn=document.getElementById("restart");
  var bn=function(n){try{return n.toLocaleString("bn-BD",{useGrouping:false})}catch(e){return String(n)}};
  var i=0, raf=null, last=0, pos=0, adding=true, paused=false;

  function add(){
    i++;
    var r=document.createElement("div"); r.className="row";
    var b=document.createElement("b"); b.textContent=bn(i);
    var t=document.createElement("span");
    t.textContent=nextMsg()+" "+emo[(i*7)%emo.length]+emo[(i*3+1)%emo.length];
    r.appendChild(b); r.appendChild(t); list.appendChild(r);
    num.textContent=bn(i)+" / "+bn(TOTAL);
    fill.style.width=(i/TOTAL*100)+"%";
    if(i>=TOTAL){ adding=false; finish(); }
  }
  function finish(){
    var d=document.createElement("div"); d.className="done"; d.style.display="block";
    d.textContent="১০০০ বার সরি বলা শেষ 🎉 Jikrah, প্লিজ এবার আমাকে মাফ করে দাও 🥹💞";
    list.appendChild(d);
    pauseBtn.disabled=true;
  }
  function frame(t){
    if(adding && t-last>=DELAY){ last=t; add(); }
    var target=list.scrollHeight-list.clientHeight, diff=target-pos;
    if(diff>0.3){
      pos+=Math.min(diff,Math.max(diff*0.03,0.35));
      list.scrollTop=pos;
    } else if(!adding){ raf=null; return; }
    raf=requestAnimationFrame(frame);
  }
  function start(){ stop(); raf=requestAnimationFrame(frame); }
  function stop(){ if(raf){cancelAnimationFrame(raf);raf=null;} }
  pauseBtn.onclick=function(){
    if(i>=TOTAL) return;
    paused=!paused;
    if(paused){stop();pauseBtn.textContent="চালাও ▶️";}
    else{start();pauseBtn.textContent="থামাও ⏸️";}
  };
  restartBtn.onclick=function(){
    stop(); list.innerHTML=""; queue=[]; i=0; pos=0; last=0; adding=true; paused=false;
    list.scrollTop=0;
    pauseBtn.disabled=false; pauseBtn.textContent="থামাও ⏸️";
    num.textContent="০ / "+bn(TOTAL); fill.style.width="0";
    start();
  };
  num.textContent="০ / "+bn(TOTAL);
  start();
})();
</script>
</body>
</html>
